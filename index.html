<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROSA — Culture Calendar</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211d2c;background:#f9f8f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#231b32;color:#fff;padding:27px clamp(18px,4vw,58px)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#baa9d8}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:clamp(28px,3vw,43px);letter-spacing:-1.7px;margin:8px 0}header p{margin:0;color:#cfc8d9;font-size:13px}.topactions,.toolbar,.legend{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.btn{border:1px solid #dedbe4;background:white;color:#2b2440;border-radius:12px;padding:10px 14px;font-weight:750}.btn:hover{border-color:#8b64d9}.btn.main{background:#ddff6b;border-color:#ddff6b;color:#25172d}.btn.dark{background:#342843;color:white;border-color:#594a6e}.btn.ghost{background:transparent;color:#e9e4ef;border-color:#665778}.wrap{max-width:1480px;margin:auto;padding:24px clamp(15px,3vw,45px)}.toolbar{justify-content:space-between;margin:7px 0 22px}.toolbar h2{margin:0;font-size:25px;min-width:175px;letter-spacing:-.7px}.nav{display:flex;align-items:center;gap:8px}.search{border:1px solid #e2dfe8;border-radius:12px;padding:11px 12px;background:white;min-width:220px}.legend{margin:0 0 16px}.tag{font-size:12px;padding:8px 11px;border-radius:99px;border:1px solid transparent;font-weight:750;cursor:pointer}.tag.off{opacity:.37}.marketing{background:#ffe0b1;color:#763f00}.pop{background:#ead9ff;color:#633197}.societe{background:#c6edeb;color:#17565a}.counter{margin-left:auto;color:#736b7b;font-size:13px;font-weight:700}.calendar{background:white;border:1px solid #eae7ee;border-radius:18px;overflow:hidden;box-shadow:0 8px 35px #29203509}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{background:#eeeaf3}.weekdays div{text-align:center;font-size:11px;font-weight:850;color:#60556d;padding:14px}.day{border-top:1px solid #eeeaf3;border-right:1px solid #eeeaf3;min-height:135px;padding:8px 6px 10px;min-width:0;transition:background .15s}.day:nth-child(7n){border-right:0}.day.other{background:#fbfafc}.day.today .number{background:#282033;color:#fff}.number{display:inline-flex;width:28px;height:28px;border-radius:99px;align-items:center;justify-content:center;font-size:12px;color:#6c6473;font-weight:800}.dayhead{display:flex;justify-content:space-between;align-items:center}.smalladd{opacity:0;border:0;background:#f1edf6;width:23px;height:23px;border-radius:7px;color:#645570}.day:hover .smalladd{opacity:1}.events{display:flex;flex-direction:column;gap:4px;margin-top:4px}.event{display:block;text-align:left;border:0;border-radius:5px;padding:5px 6px;width:100%;font-size:10.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.event:hover{filter:brightness(.94)}.event .continuation{opacity:.7}.more{border:0;background:transparent;color:#75628b;text-align:left;font-weight:800;font-size:11px;padding:3px}.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12px;color:#766e7f;margin-top:16px}.empty{color:#8f829b;text-align:center;padding:50px}dialog{border:none;border-radius:19px;width:min(540px,calc(100vw - 30px));padding:0;box-shadow:0 30px 90px #1a102959}dialog::backdrop{background:#180f25a8}.modalhead{padding:22px 24px 10px;display:flex;justify-content:space-between;align-items:center}.modalhead h3{font-size:22px;margin:0}.close{border:0;background:#f4f0f8;border-radius:99px;font-size:23px;width:33px;height:33px}form{padding:8px 24px 25px}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:800;color:#4f4560}.field input,.field select{background:white;border:1px solid #dcd5e3;border-radius:10px;padding:11px;width:100%;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalbuttons{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.notice{background:#fff5da;padding:11px 14px;border-radius:10px;font-size:12px;color:#6f5314;line-height:1.4}.hidden{display:none!important}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#2e233b;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:10;font-size:13px}.file{display:none}@media(max-width:850px){.day{min-height:93px;padding:5px 3px}.event{font-size:9px;padding:4px 3px}.number{width:22px;height:22px;font-size:10px}.toolbar h2{font-size:22px}.search{min-width:150px;max-width:100%}.btn{padding:9px 11px;font-size:12px}}@media(max-width:560px){.day{min-height:76px}.weekdays div{padding:11px 2px}.event{font-size:0;height:11px;padding:0;border-radius:4px}.event::after{content:' ';display:block}.more{font-size:9px}.two{grid-template-columns:1fr}.counter{width:100%}}
</style></head><body>
<header><div class="eyebrow">ROSA / CULTURE INTELLIGENCE</div><div class="head"><div><h1>THE CULTURE CALENDAR ✳</h1><p>Toutes les occasions d'avoir quelque chose à raconter.</p></div><div class="topactions"><button class="btn ghost" id="refreshBtn">↻ Actualiser les données</button><button class="btn main" id="addBtn" disabled title="L’ajout partagé sera activé avec l’authentification">＋ Ajouter un événement · bientôt</button></div></div></header>
<main class="wrap"><div class="toolbar"><div class="nav"><button class="btn" id="prev" aria-label="Mois précédent">←</button><h2 id="month"></h2><button class="btn" id="next" aria-label="Mois suivant">→</button><button class="btn" id="today">Aujourd'hui</button></div><input class="search" id="search" placeholder="⌕ Chercher un événement…" aria-label="Rechercher"></div>
<div class="legend"><button class="tag marketing" data-family="marketing">● Marronnier marketing</button><button class="tag pop" data-family="pop">● Pop culture</button><button class="tag societe" data-family="societe">● Société</button><span class="counter" id="counter"></span></div>
<div class="calendar"><div class="weekdays"><div>LUN</div><div>MAR</div><div>MER</div><div>JEU</div><div>VEN</div><div>SAM</div><div>DIM</div></div><div class="days" id="days"></div></div>
<div class="foot"><span>✳ Les événements sont chargés depuis notre base Supabase.</span><span>Consultation partagée · Ajout et modification en préparation.</span></div></main>
<div id="toast" role="status"></div>
<script>
(()=>{'use strict';
const URL='https://yqitgtjnrtgsucrtctwl.supabase.co', KEY='sb_publishable_h1-lUc1E6FSGGaNG9C0Sww_H7c8gZm4';
const $=id=>document.getElementById(id);
const today=new Date();
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
let year=today.getFullYear(),month=today.getMonth(),events=[],visible={marketing:true,pop:true,societe:true};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function familyVal(s){s=String(s||'').toLowerCase();return s.includes('pop')?'pop':s.includes('soci')?'societe':'marketing'}
let noticeTimer;
function notice(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('toast').style.display='none',4500)}
function matches(e){return visible[e.family]&&(e.title||'').toLocaleLowerCase('fr').includes($('search').value.toLocaleLowerCase('fr'))}
function render(){
  const first=new Date(year,month,1),offset=(first.getDay()+6)%7,last=iso(new Date(year,month+1,0)),size=Math.ceil((new Date(year,month+1,0).getDate()+offset)/7)*7;
  let label=first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  $('month').textContent=label[0].toUpperCase()+label.slice(1);
  const count=events.filter(e=>matches(e)&&e.start<=last&&(e.end||e.start)>=iso(first)).length;
  $('counter').textContent=count+' événement'+(count>1?'s':'')+' ce mois';
  let html='';
  for(let i=0;i<size;i++){
    let d=new Date(year,month,i-offset+1),date=iso(d),other=d.getMonth()!==month;
    const found=events.filter(e=>matches(e)&&e.start<=date&&(e.end||e.start)>=date).sort((a,b)=>a.start.localeCompare(b.start)||a.title.localeCompare(b.title));
    html+='<div class="day '+(other?'other ':'')+(date===iso(today)?'today':'')+'"><div class="dayhead"><span class="number">'+d.getDate()+'</span></div><div class="events">';
    for(const e of found.slice(0,4))html+='<button class="event '+esc(e.family)+'" data-edit="'+esc(e.id)+'" title="'+esc(e.title)+' ('+esc(e.start)+(e.end?' → '+esc(e.end):'')+')">'+(e.start<date?'<span class="continuation">↔ </span>':'')+esc(e.title)+'</button>';
    if(found.length>4)html+='<button class="more" data-more="'+date+'">+'+(found.length-4)+' autres</button>';
    html+='</div></div>';
  }
  $('days').innerHTML=html;
}
async function loadEvents(){
  $('counter').textContent='Chargement…';
  let all=[],from=0,size=1000;
  try{
    while(true){
      let response=await fetch(URL+'/rest/v1/events?select=id,event_name,start_date,end_date,editorial_family,recurrence&order=start_date.asc&offset='+from+'&limit='+size,{
        headers:{'apikey':KEY,'Authorization':'Bearer '+KEY},cache:'no-store'
      });
      if(!response.ok)throw Error('HTTP '+response.status+' — '+(await response.text()).slice(0,170));
      const batch=await response.json();
      if(!Array.isArray(batch))throw Error('Réponse inattendue');
      all.push(...batch);
      if(batch.length<size)break;
      from+=size;
    }
    events=all.filter(x=>x.start_date&&x.event_name).map(x=>({
      id:String(x.id),title:x.event_name,start:x.start_date,end:x.end_date||'',
      family:familyVal(x.editorial_family),recurrence:x.recurrence||'À confirmer'
    }));
    render();
    if(!events.length)notice('Aucun événement trouvé. Vérifie la politique SELECT dans Supabase.');
  }catch(err){
    render();
    notice('Connexion Supabase impossible : '+err.message);
    console.error('ROSA Calendar Supabase:',err);
  }
}
$('days').addEventListener('click',e=>{
  const target=e.target.closest('[data-edit],[data-more]');if(!target)return;
  if(target.dataset.edit){
    const item=events.find(x=>x.id===target.dataset.edit);
    if(item)alert(item.title+'
'+item.start+(item.end?' → '+item.end:'')+'
'+({marketing:'Marketing',pop:'Pop culture',societe:'Société'}[item.family])+'
Récurrence : '+item.recurrence+'

Modification bientôt disponible.');
  }else if(target.dataset.more){
    const date=target.dataset.more;
    notice(events.filter(x=>matches(x)&&x.start<=date&&(x.end||x.start)>=date).map(x=>x.title).join(' • ').slice(0,350));
  }
});
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};
$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};
$('today').onclick=()=>{year=today.getFullYear();month=today.getMonth();render()};
$('search').oninput=render;
$('refreshBtn').onclick=loadEvents;
document.querySelectorAll('[data-family]').forEach(btn=>btn.onclick=()=>{visible[btn.dataset.family]=!visible[btn.dataset.family];btn.classList.toggle('off',!visible[btn.dataset.family]);render()});
loadEvents();
})();
</script></body></html>
